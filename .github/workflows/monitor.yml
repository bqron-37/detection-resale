name: Ado Goods Resale Monitor

on:
  schedule:
    # 10分ごとに実行 (GitHub Actionsのスケジュールは遅延することがあります)
    - cron: '*/10 * * * *'
  workflow_dispatch:
    # GitHubの管理画面から手動で実行できるようにする

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Run resale detection
      env:
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      run: |
        python detect_resale.py

    - name: Commit and push if state changed
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add stock_state.json
        # 変更がある場合のみコミットしてプッシュ
        if ! git diff --cached --quiet; then
          git commit -m "chore: update stock state [skip ci]"
          git push
        else
          echo "No changes in stock state."
        fi
